version: "3.8"

# Sobe o PostgreSQL e um container de build Fortran.
# O pipeline é compilado e executado dentro do container.

services:
  postgres:
    image: postgres:16
    container_name: eedb_fortran_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./setup_database.sql:/docker-entrypoint-initdb.d/setup_database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  fortran-etl:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # FUZZY | SPLINK — estratégia fixada em tempo de compilação
        # sobrescrita possível em runtime via MATCH_STRATEGY abaixo
        STRATEGY: ${STRATEGY:-FUZZY}
    container_name: eedb_fortran_etl
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: eedb
      RAW_ORIGEM_DIR: /opt/data/raw/origem
      TRUSTED_OUT_DIR: /opt/data/trusted
      DELIVERY_OUT_DIR: /opt/data/delivery
      # runtime override: se definida, prevalece sobre a flag de compilação
      MATCH_STRATEGY: ${MATCH_STRATEGY:-fuzzy}
    volumes:
      - ./data:/opt/data

volumes:
  pgdata:
